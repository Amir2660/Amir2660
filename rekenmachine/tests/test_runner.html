<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Calculator Tests</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-results div { margin-bottom: 5px; padding: 5px; border-radius: 3px; }
        .pass { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .fail { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        h2 { margin-top: 0; }
    </style>
</head>
<body>
    <h1>Calculator Test Results</h1>
    <div id="test-results"></div>

    <!-- Calculator's display element needed for the script -->
    <input type="text" id="display" style="display: none;">

    <script src="../script.js"></script>
    <script src="test_calculator.js"></script>
</body>
</html>
